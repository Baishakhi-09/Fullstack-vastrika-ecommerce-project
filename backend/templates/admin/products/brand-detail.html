<!DOCTYPE html>
<html lang="en">
    <head>
        {% load static %}

        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <link rel="icon" 
            type="image/x-icon" 
            href="{% static 'admin/images/logo/favicon/vastrika-favicon.png' %}">

        <title>{{ brand.name }}</title>

        <style>

            *{
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body{
                font-family: Arial, sans-serif;
                background: #f5f7fb;
                color: #222;
            }

            .brand-wrapper{
                max-width: 1200px;
                margin: 60px auto;
                padding: 0 20px;
            }

            .brand-card{
                background: #ffffff;
                border-radius: 16px;
                padding: 40px;
                box-shadow: 0 4px 20px rgba(0,0,0,0.08);

                display: flex;
                align-items: center;
                gap: 40px;
                flex-wrap: wrap;
            }

            .brand-logo{
                width: 180px;
                height: 180px;
                background: #f7f7f7;
                border-radius: 16px;

                display: flex;
                align-items: center;
                justify-content: center;

                overflow: hidden;
                flex-shrink: 0;
            }

            .brand-logo img{
                width: 100%;
                height: 100%;
                object-fit: contain;
                padding: 20px;
            }

            .brand-content{
                flex: 1;
                min-width: 280px;
            }

            .brand-title{
                font-size: 42px;
                font-weight: 700;
                margin-bottom: 20px;
                color: #111;
            }

            .brand-description{
                font-size: 17px;
                line-height: 1.8;
                color: #555;
            }

            .brand-status{
                display: inline-block;
                margin-top: 20px;
                padding: 8px 16px;
                background: #e8f7ee;
                color: #198754;
                border-radius: 50px;
                font-size: 14px;
                font-weight: 600;
            }

            @media(max-width:768px){

                .brand-card{
                    padding: 25px;
                    text-align: center;
                    justify-content: center;
                }

                .brand-title{
                    font-size: 32px;
                }

                .brand-logo{
                    width: 140px;
                    height: 140px;
                }
            }

        </style>

    </head>

    <body>
        <div class="brand-wrapper">
            <div class="brand-card">
                {% if brand.logo %}
                    <div class="brand-logo">
                        <img src="{{ brand.logo.url }}" alt="{{ brand.name }}">
                    </div>
                {% endif %}

                <div class="brand-content">
                    <h1 class="brand-title">
                        {{ brand.name }}
                    </h1>

                    <p class="brand-description">
                        {{ brand.description }}
                    </p>

                    {% if brand.is_active %}
                        <span class="brand-status">
                            Active Brand
                        </span>
                    {% endif %}
                </div>
            </div>
        </div>
    </body>
</html>
