<!DOCTYPE html>
<html>
<head>
    {% load static %}

    <title>{{ product.name }}</title>

    <link rel="icon" 
        type="image/x-icon" 
        href="{% static 'admin/images/logo/favicon/vastrika-favicon.png' %}">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family:Arial,sans-serif;
            background:#f8fafc;
            padding:40px;
        }

        .product-container{
            max-width: 1200px;
            margin: 20px auto;
            padding: 0 20px;
        }

        .product-layout{
            background: #ffffff;
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            display: flex;
            align-items: center;
            gap: 40px;
            flex-wrap: wrap;
        }

        .product-image{
            width: 180px;
            height: 180px;
            background: #f7f7f7;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            flex-shrink: 0;
        }

        .product-image img{
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .product-info{
            flex: 1;
            min-width: 280px;
        }

        .product-title{
            font-size: 42px;
            font-weight: 700;
            margin-bottom: 20px;
            color: #111;
        }

        .product-description{
            font-size: 17px;
            line-height: 1.8;
            color: #555;
        }

        .product-price{
            font-size:36px;
            font-weight:700;
            color:#e11d48;
        }

    </style>
</head>

<body>

<div class="product-container">

    <div class="product-layout">

        <div class="product-image">

            {% with first_image=product.images.first %}
                {% if first_image %}
                    <img
                        src="{{ first_image.image.url }}"
                        alt="{{ product.name }}">
                {% endif %}
            {% endwith %}

        </div>

        <div class="product-info">

            <h1 class="product-title">
                {{ product.name }}
            </h1>

            <div class="product-description">
                {{ product.description }}
            </div>

            <div class="product-price">
                ₹{{ product.selling_price }}
            </div>

        </div>

    </div>

</div>

</body>
</html>
